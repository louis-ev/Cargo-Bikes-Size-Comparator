name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      # Compare package.json versions through the API to avoid fetching history (the repo holds many images)
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          readVersion() {
            gh api "repos/${{ github.repository }}/contents/package.json?ref=$1" --jq .content 2>/dev/null \
              | base64 -d | jq -r .version
          }
          current=$(readVersion "${{ github.sha }}")
          previous=$(readVersion "$BEFORE" || true)
          echo "Version: ${previous:-none} -> $current"
          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-version
    if: github.event_name == 'workflow_dispatch' || needs.check-version.outputs.changed == 'true'
    # Job-level so a push without version bump can't cancel an ongoing deploy
    concurrency:
      group: 'production'
      cancel-in-progress: true
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Delete zero byte files
        run: find ./dist -size 0c -delete
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
